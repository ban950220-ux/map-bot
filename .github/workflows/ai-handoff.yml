name: AI handoff contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/dev.py contract
      - name: Record source and changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD >> "$GITHUB_STEP_SUMMARY"
          fi
