name: Offline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run install:ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run offline map regression
        run: node scripts/check-nearby.mjs
      - name: Run audit regressions
        run: npm run test:audit
      - name: Check NAVER directions links
        run: npm run test:directions
      - name: Lint
        run: npm run lint
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run deterministic browser acceptance (no provider credentials)
        run: npx playwright test
